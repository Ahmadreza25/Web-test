<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex justify-center items-center ">
    <div class="w-[600px] h-[600px] bg-green-100 mt-10 rounded-[20px] flex justify-center items-center flex-col
    max-md:bg-slate-900
    max-lg:w-[550px] max-lg:h-[550px]
    ">
        <h2 class="font-black
        max-sm:text-[15px] max-sm:text-slate-50

        max-md:text-[20px] max-md:text-slate-50
        ">
            Sign Up
        </h2>
        <div class="mt-20
        max-lg:mt-10
        ">
            <div class="mt-[50px]">
                <input class="w-[300px] h-[40px] px-2 bg-green-100 outline-none border-b-2 border-b-slate-700
                max-sm:bg-slate-900 max-sm:border-b-slate-300 max-sm:border-b-[1px] max-sm:text-slate-50
                max-sm:w-[200px] max-sm:h-[25px] max-sm:text-[10px]

                max-md:bg-slate-900 max-md:border-b-slate-200 max-md:border-b-[1px] max-md:text-slate-50
                max-md:w-[270px] max-md:h-[30px] max-md:text-[13px]

                max-lg:w-[270px] max-lg:h-[35px] 
                " placeholder="Email*"/>
            </div>
            <div class="mt-[50px]">
                <input class="w-[300px] h-[40px] px-2 bg-green-100 outline-none border-b-2 border-b-slate-700
                max-sm:bg-slate-900 max-sm:border-b-slate-300 max-sm:border-b-[1px] max-sm:text-slate-50
                max-sm:w-[200px] max-sm:h-[25px] max-sm:text-[10px]

                max-md:bg-slate-900 max-md:border-b-slate-200 max-md:border-b-[1px] max-md:text-slate-50
                max-md:w-[270px] max-md:h-[30px] max-md:text-[13px]

                max-lg:w-[270px] max-lg:h-[35px] 
                " placeholder="Password*"/>
            </div>
            <div class="mt-[50px]">
                <input class="w-[300px] h-[40px] px-2 bg-green-100 outline-none border-b-2 border-b-slate-700
                max-sm:bg-slate-900 max-sm:border-b-slate-300 max-sm:border-b-[1px] max-sm:text-slate-50
                max-sm:w-[200px] max-sm:h-[25px] max-sm:text-[10px]

                max-md:bg-slate-900 max-md:border-b-slate-200 max-md:border-b-[1px] max-md:text-slate-50
                max-md:w-[270px] max-md:h-[30px] max-md:text-[13px]

                max-lg:w-[270px] max-lg:h-[35px] 
                " placeholder="Username*"/>
            </div>
        </div>
        <div class="mt-[100px]
        max-lg:mt-[60px]
        ">
            <button id="sign-up" class="bg-slate-900 w-[120px] h-[40px] rounded-lg text-slate-50 hover:bg-blue-700
            max-sm:w-[80px] max-sm:h-[30px] max-sm:text-[10px] max-sm:rounded-[5px] max-sm:bg-slate-50 max-sm:text-slate-900
            max-md:w-[100px] max-md:h-[35px] max-md:text-[13px] max-md:rounded-[5px] max-md:bg-slate-50 max-md:text-slate-900
            ">
                Sign Up
            </button>
        </div>
    </div>
    <script src="./PageSingup.js"></script>
</body>
</html>
